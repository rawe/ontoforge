# Continuous Integration
#
# Runs on every push to main and on pull requests:
#   - Server: typecheck, unit tests, integration tests (against a Neo4j
#     service container), container image build (no push)
#   - Frontend: lint, production build

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:2026.02.2
        ports:
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/ontoforge_dev
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ontoforge_dev 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: Integration tests
        working-directory: server
        run: npm run test:integration

      - name: Build container image
        run: docker build -t ontoforge-server:ci server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
