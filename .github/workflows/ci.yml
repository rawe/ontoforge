# Continuous Integration
#
# Runs on every push to main and on pull requests:
#   - Server: typecheck, unit tests, container image build (no push)
#   - Frontend: lint, production build
#
# No step needs a database. Integration tests are disabled below — see the
# comment at the step. They remain part of the test suite and are run locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Unit tests
        working-directory: server
        run: npm test

      # DISABLED — integration tests. The suite drives the real database
      # through the adapter, so it cannot run without one. Run it locally
      # against the docker-compose PostgreSQL:
      #
      #   docker compose up -d && cd server && npm run test:integration
      #
      # Cost while enabled: ~46s.
      #
      # - name: Integration tests
      #   working-directory: server
      #   run: npm run test:integration

      - name: Build container image
        run: docker build -t ontoforge-server:ci server

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
