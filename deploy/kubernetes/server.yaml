# Any number of identical servers behind one Service: they share PostgreSQL
# (schema and data) and Valkey (conversations), so no request needs stickiness.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ontoforge-server
  labels:
    app.kubernetes.io/name: ontoforge-server
spec:
  # More than one replica needs Valkey (valkey.yaml) and SHARED_STATE=valkey with
  # VALKEY_URL. Without Valkey: exactly 1, with SHARED_STATE=memory (the default).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ontoforge-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ontoforge-server
    spec:
      # Above preStop (5 s) + drain (SHUTDOWN_DRAIN_SECONDS, 20 s by default)
      # + closing the stores, with margin.
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ontoforge-server
      containers:
        - name: server
          # Pin the release; the probes below need /livez and /readyz.
          image: ghcr.io/rawe/ontoforge-server:VERSION
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: ENV_FILE
              value: /config/ontoforge.env
          envFrom:
            - secretRef:
                name: ontoforge-secrets
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          # Up to 30 minutes to boot: a storage upgrade, or waiting for another
          # server's, keeps the port closed, and a kill restarts the upgrade.
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 6
          lifecycle:
            # Lets the Service drop the pod before SIGTERM starts the drain.
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: ontoforge-config
---
apiVersion: v1
kind: Service
metadata:
  name: ontoforge-server
  labels:
    app.kubernetes.io/name: ontoforge-server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ontoforge-server
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ontoforge-server
  labels:
    app.kubernetes.io/name: ontoforge-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ontoforge-server
