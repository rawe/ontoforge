services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: ontoforge-postgres-dev
    ports:
      - "5432:5432"
    environment:
      # User stays the image default (postgres) — no init script needed.
      POSTGRES_PASSWORD: ontoforge_dev
      POSTGRES_DB: ontoforge
    volumes:
      # PG 18+ images declare the volume at /var/lib/postgresql (not …/data);
      # mounting the old path silently loses persistence.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontoforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Shared conversations (THREAD_STORE=valkey) and the Valkey test suite.
  # Nothing is persisted: a restart loses every conversation, by design.
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: ontoforge-valkey-dev
    command:
      - valkey-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
