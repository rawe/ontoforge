services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: ontoforge-postgres
    ports:
      # External port differs from dev (5432) to avoid conflicts
      - "15432:5432"
    environment:
      # User stays the image default (postgres) — no init script needed.
      POSTGRES_PASSWORD: ontoforge_dev
      POSTGRES_DB: ontoforge
    volumes:
      # PG 18+ images declare the volume at /var/lib/postgresql (not …/data);
      # mounting the old path silently loses persistence.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontoforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Neo4j — the alternative adapter. Uncomment to run the stack on Neo4j and
  # set the server service's DB_* environment to the Neo4j values.
  # neo4j:
  #   image: neo4j:2026.02.2
  #   container_name: ontoforge-neo4j
  #   ports:
  #     # External ports differ from dev (7474/7687) to avoid conflicts
  #     - "17474:7474"
  #     - "17687:7687"
  #   environment:
  #     NEO4J_AUTH: neo4j/ontoforge_dev
  #   volumes:
  #     - neo4j-data:/data
  #   healthcheck:
  #     test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "ontoforge_dev", "RETURN 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s

  server:
    build: ../server
    container_name: ontoforge-server
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: postgres
      # DB_URI uses Docker-internal networking — not affected by external port mapping
      DB_URI: postgresql://postgres:5432/ontoforge
      DB_USER: postgres
      DB_PASSWORD: ontoforge_dev
      # Semantic search (optional — remove comments to enable)
      # EMBEDDING_PROVIDER: ollama
      # EMBEDDING_MODEL: nomic-embed-text
      # If Ollama runs on the host machine:
      # EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # If Ollama runs as a container in this compose (see ollama service below):
      # EMBEDDING_BASE_URL: http://ollama:11434
      # For OpenAI-compatible providers: set EMBEDDING_PROVIDER to "openai"
      # EMBEDDING_API_KEY: sk-...
      # EMBEDDING_DIMENSIONS: 1536
      # AI-powered runtime (optional — remove comments to enable)
      # Requires a model with tool calling support. Recommended Ollama models:
      #   qwen3:8b (~6 GB RAM), qwen3:14b (~11 GB), qwen3:32b (~22 GB)
      # AI_PROVIDER: ollama
      # AI_MODEL: qwen3:8b
      # If Ollama runs on the host machine:
      # AI_BASE_URL: http://host.docker.internal:11434
      # If Ollama runs as a container in this compose (see ollama service below):
      # AI_BASE_URL: http://ollama:11434
      # For OpenAI-compatible providers: set AI_PROVIDER to "openai"
      # AI_API_KEY: sk-...
      # Model thinking effort: none, low, medium or high (unset = model default)
      # AI_REASONING_EFFORT: medium
      # MCP default ontology key (optional — used when no key in URL path or header)
      # DEFAULT_MCP_ONTOLOGY_KEY: my_ontology
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    container_name: ontoforge-frontend
    ports:
      - "3000:80"
    environment:
      # Internal URL of the server service — nginx proxies /api and /mcp here
      BACKEND_URL: http://server:8000
    depends_on:
      - server

  # Ollama provider (optional — uncomment to run Ollama in Docker)
  # After first start, pull the models you need:
  #   docker exec ollama ollama pull nomic-embed-text   (for semantic search)
  #   docker exec ollama ollama pull qwen3:8b            (for AI features)
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ontoforge-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  postgres-data:
  neo4j-data:
  # ollama-data:
