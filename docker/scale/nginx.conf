# Round-robin load balancer for the scale harness: no stickiness, every request
# balanced on its own. nginx OSS has no active health checks: a stopped backend drops out
# of DNS (`resolve`) or refuses the connect, and the request goes to the other one.

worker_processes 2;

events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS; a stopped container disappears from it.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream backends {
        zone backends 64k;
        server backend-a:8000 resolve max_fails=1 fail_timeout=5s;
        server backend-b:8000 resolve max_fails=1 fail_timeout=5s;
        # Reused upstream connections: without them the benchmark's load runs the
        # container out of ephemeral ports (connect: Address not available).
        # Balancing stays per request; an idle connection a stopped backend
        # closed is an error nginx retries.
        keepalive 64;
    }

    access_log off;
    client_max_body_size 64m;

    server {
        listen 80;

        location / {
            proxy_pass http://backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            # NDJSON chat streams pass through as they are written.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;

            # nginx never resends a non-idempotent request (POST, PATCH) once it
            # reached a backend; a refused connect is retried for every method.
            proxy_connect_timeout 1s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 2;

            # Which backend answered, for the scenario and benchmark scripts.
            add_header X-Upstream $upstream_addr always;
        }
    }
}
