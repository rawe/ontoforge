services:
  neo4j:
    image: neo4j:2026.02.2
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/changeme
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ontoforge-server:
    image: ghcr.io/rawe/ontoforge-server:${VERSION:-latest}
    ports:
      - "8000:8000"
    environment:
      DB_URI: bolt://neo4j:7687
      DB_USER: neo4j
      DB_PASSWORD: changeme
      # Semantic search (optional — remove comments to enable)
      # EMBEDDING_PROVIDER: ollama
      # EMBEDDING_MODEL: nomic-embed-text
      # If Ollama runs on the host machine:
      # EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # If Ollama runs as a container in this compose (see ollama service below):
      # EMBEDDING_BASE_URL: http://ollama:11434
      # For OpenAI-compatible providers: set EMBEDDING_PROVIDER to "openai"
      # EMBEDDING_API_KEY: sk-...
      # EMBEDDING_DIMENSIONS: 1536
      # AI-powered runtime (optional — remove comments to enable)
      # Requires a model with tool calling support. Recommended Ollama models:
      #   qwen3:8b (~6 GB RAM), qwen3:14b (~11 GB), qwen3:32b (~22 GB)
      # AI_PROVIDER: ollama
      # AI_MODEL: qwen3:8b
      # If Ollama runs on the host machine:
      # AI_BASE_URL: http://host.docker.internal:11434
      # If Ollama runs as a container in this compose (see ollama service below):
      # AI_BASE_URL: http://ollama:11434
      # For OpenAI-compatible providers: set AI_PROVIDER to "openai"
      # AI_API_KEY: sk-...
      # MCP default ontology key (optional — used when no key in URL path or header)
      # DEFAULT_MCP_ONTOLOGY_KEY: my_ontology
    depends_on:
      neo4j:
        condition: service_healthy

  ontoforge-ui:
    image: ghcr.io/rawe/ontoforge-ui:${VERSION:-latest}
    ports:
      - "3000:80"
    environment:
      # Internal URL of the ontoforge-server service — nginx proxies /api and /mcp here
      BACKEND_URL: http://ontoforge-server:8000
    depends_on:
      - ontoforge-server

  # Ollama provider (optional — uncomment to run Ollama in Docker)
  # After first start, pull the models you need:
  #   docker exec ollama ollama pull nomic-embed-text   (for semantic search)
  #   docker exec ollama ollama pull qwen3:8b            (for AI features)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  neo4j-data:
  # ollama-data:
