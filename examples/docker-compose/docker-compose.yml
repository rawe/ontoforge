services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    ports:
      - "5432:5432"
    environment:
      # User stays the image default (postgres) — no init script needed.
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: ontoforge
    volumes:
      # PG 18+ images declare the volume at /var/lib/postgresql (not …/data);
      # mounting the old path silently loses persistence.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontoforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Neo4j — the alternative adapter. Uncomment to run OntoForge on Neo4j and
  # set the ontoforge-server service's DB_* environment to the Neo4j values.
  # neo4j:
  #   image: neo4j:2026.02.2
  #   ports:
  #     - "7474:7474"
  #     - "7687:7687"
  #   environment:
  #     NEO4J_AUTH: neo4j/changeme
  #   volumes:
  #     - neo4j-data:/data
  #   healthcheck:
  #     test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "changeme", "RETURN 1"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 30s

  ontoforge-server:
    image: ghcr.io/rawe/ontoforge-server:${VERSION:-latest}
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: postgres
      # DB_URI uses Docker-internal networking (the postgres service name)
      DB_URI: postgresql://postgres:5432/ontoforge
      DB_USER: postgres
      # Mirrors POSTGRES_PASSWORD on the postgres service
      DB_PASSWORD: changeme
      # Semantic search — Ollama on the host machine.
      # EMBEDDING_PROVIDER: ollama
      # EMBEDDING_MODEL: nomic-embed-text
      # EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # If Ollama runs as a container in this compose (see ollama service below):
      # EMBEDDING_BASE_URL: http://ollama:11434
      # For OpenAI-compatible providers: set EMBEDDING_PROVIDER to "openai"
      # EMBEDDING_API_KEY: sk-...
      # EMBEDDING_DIMENSIONS: 1536
      # AI-powered runtime — Ollama on the host machine.
      # Requires a model with tool calling support. Recommended Ollama models:
      #   gemma4:12b-mlx (~8 GB RAM, Apple Silicon), qwen3:8b (~6 GB), qwen3:32b (~22 GB)
      # AI_PROVIDER: ollama
      # AI_MODEL: gemma4:12b-mlx
      # AI_BASE_URL: http://host.docker.internal:11434
      # If Ollama runs as a container in this compose (see ollama service below):
      # AI_BASE_URL: http://ollama:11434
      # For OpenAI-compatible providers: set AI_PROVIDER to "openai"
      # AI_API_KEY: sk-...
      # Model thinking effort: none, low, medium or high (unset = model default)
      # AI_REASONING_EFFORT: medium
      # MCP default lens key (optional — used when no key in URL path or header)
      # DEFAULT_MCP_LENS_KEY: my_lens
    depends_on:
      postgres:
        condition: service_healthy

  ontoforge-ui:
    image: ghcr.io/rawe/ontoforge-ui:${VERSION:-latest}
    ports:
      - "3000:80"
    environment:
      # Internal URL of the ontoforge-server service — nginx proxies /api and /mcp here
      BACKEND_URL: http://ontoforge-server:8000
    depends_on:
      - ontoforge-server

  # Ollama provider (optional — uncomment to run Ollama in Docker instead of on the host)
  # After first start, pull the models you need:
  #   docker exec ollama ollama pull nomic-embed-text   (for semantic search)
  #   docker exec ollama ollama pull gemma4:12b-mlx     (for AI features)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  postgres-data:
  neo4j-data:
  # ollama-data:
