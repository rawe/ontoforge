services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    ports:
      - "5432:5432"
    environment:
      # User stays the image default (postgres) — no init script needed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ontoforge
    volumes:
      # PG 18+ images declare the volume at /var/lib/postgresql (not …/data);
      # mounting the old path silently loses persistence.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ontoforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ontoforge-server:
    image: ghcr.io/rawe/ontoforge-server:latest
    ports:
      - "8000:8000"
    environment:
      DB_BACKEND: postgres
      # DB_URI uses Docker-internal networking (the postgres service name)
      DB_URI: postgresql://postgres:5432/ontoforge
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Semantic search (optional — uncomment to enable)
      # EMBEDDING_PROVIDER: ollama
      # EMBEDDING_MODEL: nomic-embed-text
      # EMBEDDING_BASE_URL: http://host.docker.internal:11434
      # EMBEDDING_API_KEY:           # required for openai provider
      # EMBEDDING_DIMENSIONS:        # optional — defaults: ollama=768, openai=1536
      # AI-powered runtime (optional — uncomment to enable)
      # Requires a model with tool calling support.
      # AI_PROVIDER: ollama
      # AI_MODEL: qwen3:8b
      # AI_BASE_URL: http://host.docker.internal:11434
      # AI_API_KEY:              # required for openai provider
      # AI_REASONING_EFFORT:     # none | low | medium | high (unset = model default)
    depends_on:
      postgres:
        condition: service_healthy

  ontoforge-ui:
    image: ghcr.io/rawe/ontoforge-ui:latest
    ports:
      - "3000:80"
    environment:
      # Required — the UI container proxies /api and /mcp requests to the
      # backend via nginx. Set this to the Docker-internal URL of the
      # ontoforge-server service. The value must match the service name
      # used in this compose file (here: ontoforge-server).
      BACKEND_URL: http://ontoforge-server:8000
    depends_on:
      - ontoforge-server

  # Ollama provider (optional — uncomment to run Ollama in Docker)
  # After first start, pull the models you need:
  #   docker exec ollama ollama pull nomic-embed-text   (for semantic search)
  #   docker exec ollama ollama pull qwen3:8b            (for AI features)
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama

volumes:
  postgres-data:
  # ollama-data:
